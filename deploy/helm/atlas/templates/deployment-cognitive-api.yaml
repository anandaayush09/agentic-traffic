apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cognitive-api
  labels:
    app.kubernetes.io/name: cognitive-api
    {{- include "atlas.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cognitiveApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: cognitive-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cognitive-api
    spec:
      containers:
        - name: cognitive-api
          image: "{{ .Values.cognitiveApi.image.repository }}:{{ .Values.cognitiveApi.image.tag }}"
          imagePullPolicy: {{ .Values.cognitiveApi.image.pullPolicy }}
          command: ["python", "scripts/run_dashboard_demo_api.py"]
          env:
            - name: ATLAS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-cognitive-api-jwt
                  key: secret
            - name: ATLAS_DASHBOARD_ORIGINS
              value: {{ .Values.cognitiveApi.dashboardOrigins | quote }}
            # development | staging | production. In staging/production the API refuses to start
            # with the public demo JWT secret, so such a release MUST set a real secret
            # (--set cognitiveApi.jwtSecret=... or an existing Secret) -- see docs/operations/ci-cd.md.
            - name: ATLAS_ENV
              value: {{ .Values.cognitiveApi.environment | quote }}
            - name: ATLAS_VERSION
              value: {{ .Values.cognitiveApi.image.tag | quote }}
            - name: ATLAS_LOG_FORMAT
              value: "json"
          ports:
            - containerPort: {{ .Values.cognitiveApi.port }}
          # Ready = the live simulation has warmed up (503 until then); alive = the process answers.
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.cognitiveApi.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.cognitiveApi.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.cognitiveApi.resources | nindent 12 }}
