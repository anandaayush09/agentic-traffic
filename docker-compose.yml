# ATLAS local development / demo stack.
#
# Week 5 added the first real service -- Redpanda (Kafka API), backing atlas.bus
# (docs/design/05_communication.md). Week 6 added the first control-plane services:
# intersection_agent (one junction's decision loop, docs/design/04_agent_architecture.md
# section 4.1) and watchdog (heartbeat staleness detection / fallback trigger, section
# 4.1's failure-recovery pattern). Week 7 added corridor_coordinator (green-wave offset
# hints + spillback alerts, section 4.2). Week 10 added cognitive_api (the LangGraph
# Supervisor + JWT-protected approval queue, served by scripts/run_dashboard_demo_api.py --
# an in-memory demo server, not yet bus-connected; see ADR-0012 for why the public demo
# ships as a frozen static build instead of pointing at this live container). Redis/
# Postgres remain unwired in this build (ADR-0003's honest gap) -- adding empty compose
# stubs for them would be scaffolding nothing depends on yet.
#
# Verified for real against a running Docker Desktop + kind cluster in Week 10 (see
# scripts/kind_smoke_test.py and .github/workflows/kind.yml) -- Docker was not available
# on this project's dev machine until partway through the build, so earlier services here
# (redpanda/intersection_agent/watchdog/corridor_coordinator) were written correctly
# in-repo well before they were first actually run; the Helm chart / kind path is what has
# been most recently exercised for real, not `docker compose up` directly.
#
# Profiles:
#   app   - JUST the product: API + dashboard + Redis. This is what you want to try it locally:
#             docker compose --profile app up --build
#           then open http://localhost:8080 . The API prints an operator token on startup:
#             docker compose logs cognitive_api | grep -A1 "Operator JWT"
#   core  - twin, bus, redis, control-plane worker(s)  (Week 5-6)
#   full  - core + cognitive plane + dashboard           (Week 9-10)
#   llm   - Redis only (shared LLM rate limits)
#
# Configuration comes from the environment / a local `.env` (copy .env.example). Nothing here is a
# real secret: the JWT default below is the public demo value and is only honoured in
# ATLAS_ENV=development -- the API refuses to start with it in staging/production.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: atlas-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://localhost:8082
      - --check=false
    ports:
      - "9092:9092" # Kafka API -- what atlas.bus (kafka-python) connects to
      - "8082:8082" # Pandaproxy (REST) -- not used by atlas.bus, exposed for manual debugging
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["core", "full"]

  # Shared LLM rate-limit counters + provider health (atlas.cognitive.llm). Optional: the
  # code falls back to per-process in-memory counters when Redis is unreachable.
  # Start just this one with:  docker compose up -d redis
  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["core", "full", "llm", "app"]

  intersection_agent:
    build: .
    container_name: atlas-intersection-agent
    command:
      - python
      - -m
      - atlas.services.intersection_agent
      - --tls-id=42430333 # one corridor junction, as a smoke-scenario demo
      - --network=manhattan_midtown
      - --mode=max_pressure
      - --kafka-brokers=redpanda:9092
    environment:
      # Local/demo-only value -- a real deployment injects this via a Secret (see
      # deploy/helm/atlas/templates/secret-cognitive-api.yaml for the k8s equivalent).
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-local-demo-secret-do-not-use-in-prod-32-bytes}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["core", "full"]

  watchdog:
    build: .
    container_name: atlas-watchdog
    command:
      - python
      - -m
      - atlas.services.watchdog
      - --kafka-brokers=redpanda:9092
      - --stale-after-s=10 # 2 missed 5s heartbeat cycles (docs/design/04_agent_architecture.md)
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["core", "full"]

  corridor_coordinator:
    build: .
    container_name: atlas-corridor-coordinator
    command:
      - python
      - -m
      - atlas.services.corridor_coordinator
      - --corridor-id=corridor_42430333_42430347 # the same 5-junction arterial Week 5 trains on
      - --tls-ids=42430333,42430338,42430342,42430344,42430347
      - --network=manhattan_midtown
      - --kafka-brokers=redpanda:9092
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["core", "full"]

  cognitive_api:
    build:
      context: .
      args:
        ATLAS_VERSION: ${ATLAS_VERSION:-dev}
    image: atlas-api:${ATLAS_VERSION:-dev}
    container_name: atlas-cognitive-api
    command: ["python", "scripts/run_dashboard_demo_api.py"]
    restart: unless-stopped
    # Optional local overrides (API keys, ATLAS_* settings). Not required: `required: false`
    # means a missing .env is fine. Real secrets belong in .env (gitignored), never in this file.
    env_file:
      - path: .env
        required: false
    environment:
      ATLAS_ENV: ${ATLAS_ENV:-development}
      # Local/demo-only default; refused by the startup guard in staging/production.
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-local-demo-secret-do-not-use-in-prod-32-bytes}
      ATLAS_DASHBOARD_ORIGINS: ${ATLAS_DASHBOARD_ORIGINS:-http://localhost:8080,http://localhost:5173}
      ATLAS_REDIS_URL: redis://redis:6379/0
      # Incident history survives `docker compose restart` via the named volume below.
      ATLAS_STATE_DB: /app/state/atlas.sqlite
      ATLAS_LOG_FORMAT: ${ATLAS_LOG_FORMAT:-json}
    ports:
      - "8003:8000" # host 8003 to avoid colliding with intersection_agent's 8000:8000
    volumes:
      - atlas_state:/app/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["full", "app"] # not bus-connected yet, so not part of the "core" control-plane profile

  frontend:
    build:
      context: ./frontend
    image: atlas-web:${ATLAS_VERSION:-dev}
    environment:
      # Runtime setting served to the browser as /config.js. The BROWSER (not this container)
      # calls the API, so it is the host-published address.
      ATLAS_API_BASE_URL: ${ATLAS_API_BASE_URL:-http://localhost:8003}
    container_name: atlas-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      cognitive_api:
        condition: service_healthy
    profiles: ["full", "app"]

volumes:
  atlas_state:
