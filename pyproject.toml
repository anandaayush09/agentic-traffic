[project]
name = "atlas-traffic"
version = "0.1.0"
description = "ATLAS - Agentic Traffic Learning & Adaptive Signaling: a multi-agent AI traffic management system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "eclipse-sumo==1.27.1",
    "libsumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "pyyaml>=6.0,<7",
    "structlog>=26.0,<27",
    "gymnasium>=0.29,<1.1",
    "stable-baselines3>=2.3,<3",
    # Pinned narrow, not just "whatever satisfies stable-baselines3's own >=2.8,<3.0"
    # declaration: torch==2.14.0 (the newest resolvable) hit a real bug loading SB3
    # checkpoints on Windows -- SB3's zip loader (save_util.py's load_from_zip_file)
    # passes a non-seekable zipfile.ZipExtFile stream straight to torch.load(), and
    # very recent torch's C++ zip reader fails on that with a spurious "corrupted
    # checkpoint" error (verified: the exact same weights load fine once extracted to
    # a real file first). Pinned near SB3 2.9.0's declared floor, most likely to
    # actually have been tested against.
    "torch>=2.8,<2.9",
    "ray>=2.40,<3",
    "mlflow>=2.18,<3",
    "jsonschema>=4.23,<5",
    # kafka-python, not confluent-kafka: pure Python, no native/C-extension dependency.
    # This project has hit three separate native-DLL collisions on Windows already
    # (SB3/torch zip loading, libsumo-in-Ray, libsumo-vs-mlflow's pyarrow) -- a librdkafka
    # binding is exactly the kind of extra native surface that pattern predicts trouble
    # from, and Redpanda's Kafka-API compatibility means either client works identically.
    "kafka-python>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "langgraph>=0.6,<1",
    # PyJWT, not python-jose: HS256 needs nothing beyond stdlib hmac (no extra native
    # crypto surface), and this project has hit enough native-DLL collisions on Windows
    # already (see kafka-python's own comment above) to prefer the narrower dependency.
    "pyjwt>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "mypy>=1.14,<2",
    "types-pyyaml>=6.0,<7",
    "hypothesis>=6.100,<7",
    "httpx>=0.27,<1", # FastAPI's own TestClient dependency
]
# Only scripts/train_yolo_detector.py and scripts/export_onnx_int8.py need these --
# GPU-bound Kaggle-execution scripts (docs/design/06_ai_pipeline.md section 6.3), not
# exercised by local dev/CI (no GPU, no UA-DETRAC dataset locally). Kept out of `dev`
# deliberately so `uv sync --extra dev` / CI don't pay for ultralytics' large dependency
# tree on every run for code nothing else in the repo touches. `uv sync --extra
# perception` before running either of those two scripts.
perception = [
    "ultralytics>=8.3,<9",
    "onnx>=1.17,<2",
    "onnxruntime>=1.20,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["atlas"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ultralytics ships type info that doesn't declare YOLO as an explicit re-export from
# the package root, even though `from ultralytics import YOLO` is its own documented
# usage -- a package-level typing gap, not a project code issue.
module = "ultralytics"
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# test_rollout.py is excluded from collection entirely, not just deselected: `import ray`
# alone (verified -- no ray.init() needed) permanently breaks subsequent libsumo imports
# in that SAME process, and pytest imports every collected file regardless of marker
# filtering, so a `-m "not ray_isolated"` filter alone is not enough -- the file must
# never even be imported in the same process as libsumo-based tests. Run it separately
# with `pytest -m ray_isolated -p no:cacheprovider tests/unit/test_rollout.py` (see that
# file's module docstring for the full diagnosis).
addopts = "-ra --strict-markers --ignore=tests/unit/test_rollout.py"
markers = [
    "ray_isolated: tests that import ray, which permanently breaks subsequent libsumo imports in that SAME process (verified: bare `import ray` alone is enough, ray.init() not required, and ray.shutdown() does not undo it -- a persistent native DLL collision the process never recovers from). Excluded from collection entirely by default (see addopts' --ignore); run in a separate pytest invocation.",
    "integration: tests requiring a live external service (e.g. a running Redpanda/Kafka broker). Not excluded from collection -- unlike ray_isolated, importing these files is always safe -- but individual tests skip themselves via skipif when the service isn't reachable, since this dev machine has no Docker (see the ATLAS dev-environment memory).",
]

[tool.coverage.run]
source = ["src/atlas"]
