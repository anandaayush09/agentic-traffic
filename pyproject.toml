[project]
name = "atlas-traffic"
version = "0.1.0"
description = "ATLAS - Agentic Traffic Learning & Adaptive Signaling: a multi-agent AI traffic management system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "eclipse-sumo==1.27.1",
    "libsumo==1.27.1",
    "traci==1.27.1",
    "sumolib==1.27.1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "pyyaml>=6.0,<7",
    "structlog>=26.0,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.15,<1",
    "mypy>=1.14,<2",
    "types-pyyaml>=6.0,<7",
    "hypothesis>=6.100,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["atlas"]
mypy_path = "src"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/atlas"]
