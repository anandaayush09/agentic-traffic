# ATLAS local development / demo stack.
#
# Week 5 added the first real service -- Redpanda (Kafka API), backing atlas.bus
# (docs/design/05_communication.md). Week 6 added the first control-plane services:
# intersection_agent (one junction's decision loop, docs/design/04_agent_architecture.md
# section 4.1) and watchdog (heartbeat staleness detection / fallback trigger, section
# 4.1's failure-recovery pattern). Week 7 added corridor_coordinator (green-wave offset
# hints + spillback alerts, section 4.2). Week 10 added cognitive_api (the LangGraph
# Supervisor + JWT-protected approval queue, served by scripts/run_dashboard_demo_api.py --
# an in-memory demo server, not yet bus-connected; see ADR-0012 for why the public demo
# ships as a frozen static build instead of pointing at this live container). Redis/
# Postgres remain unwired in this build (ADR-0003's honest gap) -- adding empty compose
# stubs for them would be scaffolding nothing depends on yet.
#
# Verified for real against a running Docker Desktop + kind cluster in Week 10 (see
# scripts/kind_smoke_test.py and .github/workflows/kind.yml) -- Docker was not available
# on this project's dev machine until partway through the build, so earlier services here
# (redpanda/intersection_agent/watchdog/corridor_coordinator) were written correctly
# in-repo well before they were first actually run; the Helm chart / kind path is what has
# been most recently exercised for real, not `docker compose up` directly.
#
# Planned profiles (filled in as each milestone lands):
#   core  - twin, bus, redis, postgres, control-plane worker(s)  (Week 5-6)
#   full  - core + cognitive plane + ML services + frontend + monitoring (Week 9-10)

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: atlas-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://localhost:8082
      - --check=false
    ports:
      - "9092:9092" # Kafka API -- what atlas.bus (kafka-python) connects to
      - "8082:8082" # Pandaproxy (REST) -- not used by atlas.bus, exposed for manual debugging
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["core", "full"]

  intersection_agent:
    build: .
    container_name: atlas-intersection-agent
    command:
      - python
      - -m
      - atlas.services.intersection_agent
      - --tls-id=42430333 # one corridor junction, as a smoke-scenario demo
      - --network=manhattan_midtown
      - --mode=max_pressure
      - --kafka-brokers=redpanda:9092
    environment:
      # Local/demo-only value -- a real deployment injects this via a Secret (see
      # deploy/helm/atlas/templates/secret-cognitive-api.yaml for the k8s equivalent).
      ATLAS_JWT_SECRET: "local-demo-secret-do-not-use-in-prod-32-bytes"
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["core", "full"]

  watchdog:
    build: .
    container_name: atlas-watchdog
    command:
      - python
      - -m
      - atlas.services.watchdog
      - --kafka-brokers=redpanda:9092
      - --stale-after-s=10 # 2 missed 5s heartbeat cycles (docs/design/04_agent_architecture.md)
    ports:
      - "8001:8001"
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["core", "full"]

  corridor_coordinator:
    build: .
    container_name: atlas-corridor-coordinator
    command:
      - python
      - -m
      - atlas.services.corridor_coordinator
      - --corridor-id=corridor_42430333_42430347 # the same 5-junction arterial Week 5 trains on
      - --tls-ids=42430333,42430338,42430342,42430344,42430347
      - --network=manhattan_midtown
      - --kafka-brokers=redpanda:9092
    ports:
      - "8002:8002"
    depends_on:
      redpanda:
        condition: service_healthy
    profiles: ["core", "full"]

  cognitive_api:
    build: .
    container_name: atlas-cognitive-api
    command: ["python", "scripts/run_dashboard_demo_api.py"]
    environment:
      # Same local/demo-only value as intersection_agent above -- a real deployment
      # injects this via a Secret (deploy/helm/atlas/templates/secret-cognitive-api.yaml).
      ATLAS_JWT_SECRET: "local-demo-secret-do-not-use-in-prod-32-bytes"
    ports:
      - "8003:8000" # host 8003 to avoid colliding with intersection_agent's 8000:8000
    profiles: ["full"] # not bus-connected yet, so not part of the "core" control-plane profile
